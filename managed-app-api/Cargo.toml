[package]
name = "repo-monitor"
version = "0.1.0"
edition = "2021"

[dependencies]
serde_json = "1"
async-graphql = "7"
async-graphql-axum = "7"
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["full"] }
